[project]
name = "sledra-development"
version = "0.0.0"
description = "Sledra 记录器的开发、文档与验证工具"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    { include-group = "docs" },
    "jsonschema==4.10.3",
    "ruff==0.16.9",
]
docs = [
    "sphinx>=8,<10",
    "pydata-sphinx-theme>=0.16,<0.23",
    "myst-nb>=1,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist", "test-results"]

[tool.ruff.lint]
select = ["E4", "E9", "F"]
