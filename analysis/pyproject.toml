[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sledra-analysis"
version = "0.1.0.dev0"
description = "Sledra offline source identity and ingestion primitives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.10.3"]

[project.scripts]
sledra-history = "sledra_analysis.execution.cli:main"

[dependency-groups]
dev = ["setuptools==80.9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sledra_analysis = ["resources/contract/*.json", "resources/execution_v2/*.json"]
